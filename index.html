<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Trade Stack</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trade Stack">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cockpit ของเทรดเดอร์ — สงบ ชัด บังคับกฎ
   IDEA: แผงหน้าปัดเครื่องบิน: ไฟสถานะ risk ก่อนทุกอย่าง
   PICTURE: การ์ด Risk + เกรด A+/A ขนาดใหญ่ที่คำนวณสด
   COLOUR/TYPE: กราไฟต์ #0E1116, ทอง #E0B04A, เขียว/แดงสถานะ · IBM Plex Sans Thai + JetBrains Mono
   LAYOUT: คอลัมน์เดียว mobile-first กว้างสุด 560px, แถบนำทางล่าง */
:root{color-scheme:dark;--bg:#0E1116;--card:#171B22;--card2:#1F2530;--line:#262C36;--ink:#E6E8EB;--mut:#9AA3AF;--gold:#E0B04A;--grn:#3FB68B;--red:#F0616D;--blu:#6EA8FF}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;overflow-x:clip}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 14px 96px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.logo{width:32px;height:32px;border-radius:9px;display:block;box-shadow:0 0 0 1px #3a3220}
.sub{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.h{font-size:14px;font-weight:600}.lab{font-size:12px;color:var(--mut)}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--ink);white-space:nowrap}
.ok{color:var(--grn)}.bad{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blu)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;border-radius:3px;background:var(--grn)}
.tile{background:var(--card2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.tile b{font-family:'JetBrains Mono',monospace;font-size:15px;white-space:nowrap}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:0}
.btn{min-height:46px;border-radius:14px;padding:0 16px;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--gold);color:#14110A;border-color:var(--gold)}.btn.dng{background:#3A1A1E;color:var(--red);border-color:#5a2730}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg button:focus-visible,.tg:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mut);background:transparent}
.seg button.on{background:var(--ink);color:#0E1116}.seg button.on.sell{background:var(--red);color:#fff}.seg button.on.buy{background:var(--grn);color:#06140e}
.fld{display:flex;flex-direction:column;gap:3px;background:var(--card2);border-radius:12px;padding:7px 10px}
.fld span{font-size:11px;color:var(--mut)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;width:100%;padding:0}
.fld input{font-family:'JetBrains Mono',monospace}
textarea{background:var(--card2);border-radius:12px;padding:9px 10px;min-height:64px;resize:vertical}
select{background:var(--card2);border-radius:12px;padding:10px;min-height:44px}
select option{background:#171B22}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}.chk:first-child{border-top:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--grn);margin-top:1px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap}
.t-must{background:#3A1A1E;color:#FF8C95}.t-auto{background:#1B2A44;color:var(--blu)}
.tgs{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:13px;padding:7px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut);min-height:36px}
.tg.on{background:#3A3016;border-color:var(--gold);color:var(--gold)}
.grade{width:72px;height:72px;border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:700;flex:none}
.gA\+{background:var(--grn);color:#06140e}.gA{background:var(--blu);color:#07142a}.gNO{background:#3A1A1E;color:var(--red);font-size:16px;text-align:center;line-height:1.1}
.warn{font-size:13px;background:#2b1d10;color:#F2C96A;border-radius:10px;padding:8px 10px}
.warn.r{background:#3A1A1E;color:#FF9AA2}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shot{aspect-ratio:4/3;border:1px dashed #3a4250;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut);position:relative;overflow:hidden;cursor:pointer;background:var(--card2)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot em{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10px;background:rgba(0,0,0,.65);color:#fff;padding:1px 5px;border-radius:5px}
.trade{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:#12161C;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:0 6px env(safe-area-inset-bottom);z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);background:none;min-width:56px;min-height:48px;justify-content:center}
.nav button.on{color:var(--gold)}
.nav .plus{width:54px;height:54px;border-radius:16px;background:var(--gold);color:#14110A;margin-top:-24px;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font-size:11px;color:var(--mut);text-align:center}
.cday{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:#151A21;color:#5d6674;font-size:12px;font-weight:600;padding:0}
.cday small{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500}
.cday.today{outline:2px solid var(--ink);outline-offset:1px}
.calleg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut)}.calleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.fig{position:relative;height:170px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#0E1116;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:18px;font-size:14px}
.note{font-size:12px;color:var(--mut)}
details summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav">
<button data-go="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>หน้าแรก</button>
<button data-go="history"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>ประวัติ</button>
<button data-go="new" class="plus" aria-label="เช็กลิสต์และเปิดไม้ใหม่"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button data-go="stats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>สถิติ</button>
<button data-go="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>ตั้งค่า</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
{
// ---------- constants ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return Number.isFinite(n) ? n : null; };
const fx = (n, d = 2) => Number.isFinite(n) ? n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d}) : '–';
const money = n => Number.isFinite(n) ? (n < 0 ? '−$' : '$') + fx(Math.abs(n)) : '–';
const sgn = (n, d = 2, suf = '') => Number.isFinite(n) ? (n > 0 ? '+' : n < 0 ? '−' : '') + fx(Math.abs(n), d) + suf : '–';
const sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0);
const SYM = { XAUUSD: { pt: 0.01, dec: 2, step: '0.01' }, GBPUSD: { pt: 0.00001, dec: 5, step: '0.00001' } };
const DEF = { balance: 5000, mode: 'LIVE', contract: { XAUUSD: 100, GBPUSD: 100000 }, riskAplus: 2, riskA: 1, riskMax: 4, dailyStopPct: 4, dailyStopLosses: 3, weeklyStopPct: 8, ddReset: 10, cooldown: 10, minRR: 2, goal: 100000, apiUrl: '', token: '' };
const SWEEPS = ['EQH','EQL','PDH','PDL','Asia H','Asia L','London H','London L','Swing H/L','Inducement'];
const POIS = ['OB','FVG','S2B','B2S','Flip zone','QM','Supply','Demand'];
const EMO = ['Calm','Confident','Anxious','FOMO','Revenge','Bored'];
const MIST = ['เข้าเร็วเกินไป','ขยับ SL ออก','FOMO/ไล่ราคา','เข้าตอนแท่งยังไม่ปิด','เข้าห่างจาก B','SL ทับ liquidity','ปิดก่อนแผน','ดูจอจนปิด BE เร็ว','เทรดนอกเวลา','ใกล้ข่าว','เกิน stop rule'];
const MODELS = { A: 'A · Conservative', B: 'B · Aggressive', C: 'C · Flip zone', D: 'D · Pending HTF' };
const CHK = [
  ['ทิศตรง bias ระยะสั้น · HTF ไม่สวน · อยู่ฝั่งถูกของ 50%', 'must'],
  ['ราคาอยู่ใน POI คุณภาพสูงจริง (ไม่ใช่แค่ใกล้)', ''],
  ['กวาด liquidity แล้ว + CHoCH ด้วยแท่งปิด + ย่อเข้าจุดเข้า (ไม่ไล่)', 'must'],
  ['อยู่ใน Killzone · ไม่ใกล้ข่าวแดง · ไม่ใช่วันหยุดสหรัฐฯ · ก่อน 22:30', 'auto'],
  ['RR ≥ 1:2 จากราคาเข้าจริง · SL/TP ตามกฎ', 'must auto']
];
const DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสฯ','ศุกร์','เสาร์'];
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const SHOTS_OPEN = [['h4','H4'],['m15','M15'],['m5','M5/M1']];

// ---------- storage (IndexedDB, memory fallback) ----------
let db = null; const mem = {};
const idbOpen = () => new Promise(res => { try { const r = indexedDB.open('tradestack', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => res(); } catch (e) { res(); } });
const kget = k => new Promise(res => { if (!db) return res(mem[k]); try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(mem[k]); } catch (e) { res(mem[k]); } });
const kput = (k, v) => { mem[k] = v; if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} };

let S = JSON.parse(JSON.stringify(DEF)), T = [], view = 'home', draft = null, closeD = null, histFilter = 'ALL', statPeriod = 'week', cal = null, CF = [], cfType = 'DEP', pulling = false;
const save = () => { kput('trades', T); kput('settings', S); kput('cash', CF); };
const nowISO = () => new Date().toISOString();

// ---------- time (เวลาไทย) ----------
const BK = 7 * 36e5;
const bk = (d = new Date()) => { const x = new Date(+d + BK); return { h: x.getUTCHours(), mi: x.getUTCMinutes(), dow: x.getUTCDay(), d: x.getUTCDate(), mo: x.getUTCMonth(), key: x.toISOString().slice(0, 10) }; };
const weekKey = d => { const x = new Date(+d + BK); const dow = (x.getUTCDay() + 6) % 7; x.setUTCDate(x.getUTCDate() - dow); return x.toISOString().slice(0, 10); };
const tzOff = (tz, d) => { try { const a = new Date(d.toLocaleString('en-US', { timeZone: tz })), b = new Date(d.toLocaleString('en-US', { timeZone: 'UTC' })); return Math.round((a - b) / 36e5); } catch (e) { return null; } };
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function timeInfo(d = new Date()) {
  const t = bk(d), m = t.h * 60 + t.mi;
  const usS = tzOff('America/New_York', d) === -4 ? 1 : 0, ukS = tzOff('Europe/London', d) === 1 ? 1 : 0;
  const lon = [(14 - ukS) * 60, (17 - ukS) * 60], ny = [(19 - usS) * 60, (22 - usS) * 60];
  const inR = r => m >= r[0] && m < r[1];
  const wd = t.dow >= 1 && t.dow <= 5, win = (m >= 780 && m < 960) || (m >= 1140 && m < 1380), late = m >= 1350;
  const session = inR(ny) ? 'NY' : inR(lon) ? 'London' : (t.h >= 19 || t.h < 4) ? 'NY' : t.h >= 12 ? 'London' : 'Asia';
  const kzName = inR(ny) ? 'NY Killzone' : inR(lon) ? 'London Killzone' : '';
  return { t, m, lon, ny, inKz: !!kzName, kzName, wd, win, late, session, ok: wd && win && !!kzName && !late };
}
const fmtDT = iso => { if (!iso) return '–'; const t = bk(new Date(iso)); return t.d + ' ' + MON[t.mo] + ' ' + hm(t.h * 60 + t.mi); };

// ---------- risk engine ----------
function engine() {
  const now = new Date(), tk = bk(now).key, wk = weekKey(now);
  const closed = T.filter(x => x.status === 'CLOSED' && x.mode !== 'DEMO').sort((a, b) => a.closeTime < b.closeTime ? -1 : 1);
  const ev = closed.map(x => ({ t: x.closeTime, v: x.pnlNet || 0, cash: false })).concat(CF.map(c => ({ t: c.date, v: c.type === 'DEP' ? c.amount : -c.amount, cash: true }))).sort((a, b) => a.t < b.t ? -1 : 1);
  let eq = S.balance, peak = eq, mdd = 0; const curve = [eq];
  for (const x of ev) { eq += x.v; if (x.cash) peak += x.v; peak = Math.max(peak, eq); mdd = Math.max(mdd, peak > 0 ? (peak - eq) / peak * 100 : 0); curve.push(eq); }
  const dd = peak > 0 ? (peak - eq) / peak * 100 : 0;
  const today = closed.filter(x => bk(new Date(x.closeTime)).key === tk), week = closed.filter(x => weekKey(new Date(x.closeTime)) === wk);
  const tp = sum(today, 'pnlNet'), wp = sum(week, 'pnlNet');
  const dayLoss = Math.max(0, -tp) / Math.max(1, eq - tp) * 100, weekLoss = Math.max(0, -wp) / Math.max(1, eq - wp) * 100;
  const lossesToday = today.filter(x => x.pnlNet < 0).length;
  let streak = 0; for (let i = closed.length - 1; i >= 0 && closed[i].pnlNet < 0; i--) streak++;
  const lastLoss = [...closed].reverse().find(x => x.pnlNet < 0);
  const cool = lastLoss ? Math.max(0, S.cooldown * 6e4 - (now - new Date(lastLoss.closeTime))) : 0;
  const opened = T.filter(x => (x.status === 'CLOSED' || x.status === 'OPEN') && x.mode !== 'DEMO');
  const compliance = opened.length ? opened.filter(x => (x.grade === 'A+' || x.grade === 'A') && !x.ruleBreak).length / opened.length * 100 : 100;
  const avgR = closed.length ? sum(closed, 'r') / closed.length : 0;
  const unlocked = closed.length >= 50 && avgR > 0 && compliance >= 90;
  const stops = [];
  if (dayLoss >= S.dailyStopPct) stops.push('ขาดทุนวันนี้ถึง ' + S.dailyStopPct + '% แล้ว');
  if (lossesToday >= S.dailyStopLosses) stops.push('แพ้ครบ ' + S.dailyStopLosses + ' ไม้วันนี้แล้ว');
  if (weekLoss >= S.weeklyStopPct) stops.push('ขาดทุนสัปดาห์นี้ถึง ' + S.weeklyStopPct + '% แล้ว');
  if (streak >= 5) stops.push('แพ้ติดกัน 5 ไม้ — พัก 1 สัปดาห์ แล้วทบทวน journal');
  const ddCap = dd >= S.ddReset;
  const allow = g => { if (stops.length) return 0; const b = g === 'A+' ? (unlocked ? S.riskMax : S.riskAplus) : g === 'A' ? S.riskA : 0; return ddCap ? Math.min(b, 1) : b; };
  return { eq, peak, dd, mdd, curve, dayLoss, weekLoss, lossesToday, streak, cool, compliance, avgR, unlocked, nClosed: closed.length, stops, ddCap, allow, week, closed };
}
const gradeOf = c => (!c[0] || !c[2] || !c[4]) ? 'NO' : (c[1] && c[3]) ? 'A+' : (c[1] || c[3]) ? 'A' : 'NO';
const gLabel = g => g === 'NO' ? 'ไม่เข้า' : g;
function lotFor(sym, dist, pct, bal) {
  const cs = S.contract[sym] || 1, riskUsd = bal * pct / 100;
  if (!dist || !pct) return { lot: 0, riskUsd: 0, real: 0 };
  const lot = Math.floor(riskUsd / (dist * cs) * 100 + 1e-9) / 100;
  return { lot, riskUsd, real: lot * dist * cs };
}
function calc(D) {
  const e = num(D.entry), sl = num(D.sl), tp = num(D.tp), b = num(D.pointB), sell = D.dir === 'SELL';
  const priced = e !== null && sl !== null && tp !== null;
  const valid = priced && (sell ? (sl > e && tp < e) : (sl < e && tp > e));
  const dist = priced ? Math.abs(e - sl) : 0;
  const rr = valid ? Math.abs(tp - e) / dist : null;
  const rrB = valid && b !== null && Math.abs(b - sl) > 0 ? Math.abs(tp - b) / Math.abs(b - sl) : null;
  const ti = timeInfo();
  const auto4 = ti.ok, auto5 = valid && rr >= S.minRR;

// ---------- sync (Apps Script) ----------
async function api(body) {
  if (!S.apiUrl) throw new Error('no-url');
  const r = await fetch(S.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: S.token, ...body }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'error'); return j;
}
async function syncTrade(x) {
  if (!S.apiUrl) return false;
  try {
    x.shotUrls = x.shotUrls || {};
    for (const [k, v] of Object.entries(x.shots || {})) {
      if (v && v.startsWith('data:') && !x.shotUrls[k]) { const j = await api({ action: 'image', name: x.id + '_' + k + '.jpg', data: v.split(',')[1] }); x.shotUrls[k] = j.url; }
    }
    const { shots, ...row } = x; await api({ action: 'upsert', trade: row });
    x.synced = true; save(); return true;
  } catch (e) { x.synced = false; save(); return false; }
}

async function syncCash(c) {
  if (!S.apiUrl) return false;
  try { const { synced, ...row } = c; await api({ action: 'upsertCash', cash: row }); c.synced = true; save(); return true; } catch (e) { c.synced = false; save(); return false; }
}
const ARR = ['c', 'overrides', 'sweep', 'poi', 'emotion', 'mistakes'], TXT = ['id', 'mode', 'status', 'symbol', 'dir', 'model', 'orderType', 'openTime', 'closeTime', 'fillTime', 'session', 'weekday', 'grade', 'ruleBreakReason', 'cancelReason', 'exitType', 'quadrant', 'plan', 'context', 'trigger', 'why', 'fix', 'updatedAt'];
function fromRow(r) {
  const x = { synced: true, shots: {}, shotUrls: {} };
  for (const [k, v] of Object.entries(r)) {
    if (k.startsWith('shot_')) { if (v) x.shotUrls[k.slice(5)] = String(v); continue; }
    if (ARR.includes(k)) { const a = v === '' || v === null ? [] : String(v).split(',').map(t => t.trim()).filter(Boolean); x[k] = k === 'c' ? a.map(t => t === 'true') : a; continue; }
    if (TXT.includes(k)) { x[k] = v === null ? '' : String(v); continue; }
    if (k === 'ruleBreak' || k === 'inKillzone') { x[k] = v === true || v === 'true'; continue; }
    x[k] = v === '' || v === null ? null : (typeof v === 'number' ? v : num(v));
  }
  while (x.c.length < 5) x.c.push(false);
  return x;
}
async function pull() {
  if (!S.apiUrl || pulling) return null; pulling = true;
  try {
    const j = await api({ action: 'list' }); let n = 0;
    const loc = new Map(T.filter(x => !x.sample).map(x => [x.id, x]));
    for (const r of j.trades || []) { const x = fromRow(r), l = loc.get(x.id);
      if (!l || (l.synced && (x.updatedAt || '') >= (l.updatedAt || ''))) { if (l) x.shots = l.shots || {}; loc.set(x.id, x); n++; } }
    T = [...loc.values()];
    const cm = new Map(CF.map(c => [c.id, c]));
    for (const c of j.cash || []) { const l = cm.get(c.id); if (!l || l.synced) { cm.set(c.id, { ...c, amount: +c.amount, synced: true }); n++; } }
    CF = [...cm.values()]; save(); return n;
  } catch (e) { return null; } finally { pulling = false; }
}

// ---------- confirm rule-break ----------
function confirmBreak(C, cb) {
  const why = [];
  if (C.g === 'NO') why.push('เกรด "ไม่เข้า" — ' + (!C.c[0] ? 'ข้อ 1 ' : '') + (!C.c[2] ? 'ข้อ 3 ' : '') + (!C.c[4] ? 'ข้อ 5 ' : '') + (C.c[0] && C.c[2] && C.c[4] ? 'ขาดข้อ 2 และ 4' : 'ไม่ผ่าน (บังคับ)'));
  C.E.stops.forEach(s => why.push('หยุดเทรด: ' + s));
  if (C.E.cool > 0) why.push('ยังอยู่ในช่วงพักหลังแพ้');
  if (!why.length) return cb('');
  openModal(`<span style="font-size:20px;font-weight:700" class="bad">ไม้นี้ผิดกฎ</span>${why.map(w => `<div class="warn r">${esc(w)}</div>`).join('')}
  <div>"ไม่ได้เตรียมไว้ = ไม่ใช่ไม้ของเรา" ถ้ายังจะเข้า ไม้นี้จะถูกบันทึกเป็น <b>ผิดกฎ</b> และนับลด compliance</div>
  <span class="lab">พิมพ์เหตุผลที่ยังจะเข้า (บังคับ)</span><textarea id="rb-why"></textarea>
  <button class="btn" data-act="close-modal">ไม่เข้าแล้ว (แนะนำ)</button><button class="btn dng" id="rb-go">ยืนยันเข้าไม้แบบผิดกฎ</button>`);
  $('#rb-go').onclick = () => { const r = $('#rb-why').value.trim(); if (r.length < 5) { toast('พิมพ์เหตุผลอย่างน้อย 5 ตัวอักษร'); return; } closeModal(); cb(r); };
}

    const t = new Date(Date.UTC(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), h - 7, 10));
    const pct = g === 'A+' ? 2 : 1, riskUsd = bal * pct / 100, isX = sym === 'XAUUSD', dist = isX ? 3.5 : 0.0015, cs = isX ? 100 : 100000;
    const lot = Math.floor(riskUsd / (dist * cs) * 100) / 100, real = lot * dist * cs, sign = dir === 'SELL' ? -1 : 1, entry = isX ? 3570 + k * 3.7 : 1.3120 + k * 0.0011;
    const pnl = r * real, exit = entry + sign * r * dist;
    const x = { id: 'S' + (k + 1), sample: true, mode: 'LIVE', status: 'CLOSED', symbol: sym, dir, model: 'A', openTime: t.toISOString(), closeTime: new Date(+t + 95 * 6e4).toISOString(), session: ses, weekday: DOW[bk(t).dow], inKillzone: true,
      c: g === 'NO' ? [true, true, false, true, true] : [true, true, true, g === 'A+', true], overrides: [], grade: g, ruleBreak: g === 'NO', ruleBreakReason: g === 'NO' ? 'กลัวตกรถ' : '', entry, pointB: null, sl: entry - sign * dist, slFinal: mis.includes('ขยับ SL ออก') ? entry - sign * dist * 1.6 : entry - sign * dist,
      tp: entry + sign * dist * 3, lot, riskPct: pct, riskUsd: real, allowedPct: pct, balanceBefore: bal, rr: 3, rrB: null, sweep: ['EQH'], poi: ['OB'], emotion: [g === 'NO' ? 'FOMO' : 'Calm'], context: '', trigger: '', shots: {},
      mistakes: mis, exit, exitType: r > 0 ? 'TP' : 'SL', pnlGross: pnl, commission: 0, swap: 0, pnlNet: pnl, r, points: sign * (exit - entry) / SYM[sym].pt, plan: g === 'NO' ? '2' : '5', why: '', fix: '', synced: false };
    x.quadrant = QUAD[quadOf(x)]; bal += pnl; out.push(x); k++;
  }
  return out;
}
